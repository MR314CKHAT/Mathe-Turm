<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden – Mathe-Turm</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        color: #1f2937;
        background: linear-gradient(180deg, #dff0ff 0%, #eef6ff 45%, #fff6e5 100%);
        text-align: center;
      }
      .box {
        width: 100%;
        max-width: 460px;
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 12px 30px rgba(24, 40, 80, 0.14);
        padding: 34px 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .emoji {
        font-size: 58px;
        line-height: 1;
      }
      h1 {
        font-size: 27px;
        font-weight: 800;
        margin: 0;
        color: #3559c7;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
        color: #55627a;
      }
      .path {
        font-size: 13px;
        background: #f6f8ff;
        border-radius: 10px;
        padding: 6px 12px;
        word-break: break-all;
        color: #55627a;
      }
      a.home {
        display: inline-block;
        margin-top: 6px;
        padding: 13px 26px;
        border-radius: 16px;
        background: linear-gradient(180deg, #6d93ff, #4f7cff);
        box-shadow: 0 6px 0 #3559c7;
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        text-decoration: none;
      }
      a.home:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #3559c7;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <span class="emoji" aria-hidden="true">🧭</span>
      <h1>Hier gibt es kein Stockwerk</h1>
      <p>
        Diese Adresse existiert nicht – aber der Mathe-Turm wartet schon weiter unten auf dich!
      </p>
      <span class="path" id="path"></span>
      <a class="home" id="home" href="/Mathe-Turm/">⬆️ Zurück zum Mathe-Turm</a>
      <noscript>
        <p>Falls der Knopf nicht funktioniert: Besuche einfach die Startseite des Spiels.</p>
      </noscript>
    </main>
    <script>
      // Basis-Pfad aus der Adresse ermitteln (z. B. "/Mathe-Turm/"),
      // damit der Link auch bei umbenannten Repos oder Subpfaden passt.
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var base = parts.length > 1 ? '/' + parts[0] + '/' : '/';
        var home = document.getElementById('home');
        var path = document.getElementById('path');
        home.setAttribute('href', base);
        path.textContent = 'Gesucht: ' + location.pathname;
      })();
    </script>
  </body>
</html>
