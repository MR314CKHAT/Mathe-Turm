<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f7cff" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Mathe-Turm: Löse Rechenaufgaben und klettere Stockwerk für Stockwerk nach oben. Für Kinder der Klasse 1 bis 5."
    />
    <title>Mathe-Turm – Rechnen bis in die Wolken</title>

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mathe-Turm" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Vorschau beim Teilen (WhatsApp, Signal, ...).
         Nach dem Deploy "og:image"/"twitter:image" am besten auf die
         vollständige Adresse setzen, z. B. https://NAME.github.io/mathe-turm/og-image.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mathe-Turm" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Mathe-Turm – Rechnen bis in die Wolken" />
    <meta
      property="og:description"
      content="Löse Rechenaufgaben und klettere Stockwerk für Stockwerk nach oben. In einer festen Zeit so hoch wie möglich!"
    />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mathe-Turm – Rechnen bis in die Wolken" />
    <meta
      name="twitter:description"
      content="Rechne dich im Hochhaus nach oben – für Kinder der Klasse 1 bis 5."
    />
    <meta name="twitter:image" content="og-image.png" />

    <!-- Wenn JavaScript noch nicht lädt: kleiner Lade-Hinweis statt weißem Bildschirm.
         React ersetzt diesen Inhalt beim Start automatisch. -->
    <style>
      .boot {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        color: #1f2937;
        text-align: center;
        padding: 24px;
      }
      .boot__emoji {
        font-size: 56px;
        animation: boot-bob 1.4s ease-in-out infinite;
      }
      .boot__title {
        font-size: 24px;
        font-weight: 800;
        margin: 0;
      }
      .boot__hint {
        font-size: 15px;
        color: #55627a;
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__emoji {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span class="boot__emoji">🏢</span>
        <p class="boot__title">Mathe-Turm</p>
        <span class="boot__hint">Der Turm wird gerade gebaut …</span>
      </div>
    </div>
    <noscript>
      <div class="boot">
        <span class="boot__emoji">🧱</span>
        <p class="boot__title">JavaScript wird gebraucht</p>
        <span class="boot__hint">
          Bitte aktiviere JavaScript in deinem Browser, damit der Mathe-Turm läuft.
        </span>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
